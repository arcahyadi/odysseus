services:
  odysseus:
    build: .
    init: true   # tini as PID1 reaps reparented dev-server children (no zombie leak)
    pids_limit: 1024   # fork-bomb backstop for the terminal PTY (defense-in-depth)
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
      - "${APP_BIND:-127.0.0.1}:${DEV_PREVIEW_PROXY_PORT:-7100}:${DEV_PREVIEW_PROXY_PORT:-7100}"   # Dev Preview: admin-gated proxy (dev server itself is container-loopback, UNpublished)
    volumes:
      # ODYSSEUS_DATA_DIR: host path for all persistent app data. Point it
      # OUTSIDE the git checkout (e.g. a dedicated data volume) so repo
      # surgery/re-clones can never take the live data with them.
      - ${ODYSSEUS_DATA_DIR:-./data}:/app/data:z
      - ${REPOS_HOST_DIR:-./repos}:/app/work:z
      - ${ODYSSEUS_LOGS_DIR:-./logs}:/app/logs:z
      # Cookbook remote-server SSH identity. Odysseus can generate a key here;
      # add the shown public key to each remote server's authorized_keys.
      - ${ODYSSEUS_DATA_DIR:-./data}/ssh:/app/.ssh:z
      # Cookbook local model cache. Inside Docker, "Local" means the Odysseus
      # container, so persist its HuggingFace cache under ./data/huggingface.
      - ${ODYSSEUS_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
      # Cookbook-installed Python CLIs/packages (vLLM, llama-cpp-python, etc.)
      # land under /app/.local for the odysseus user. Persist them so a
      # container recreate does not silently remove installed serve engines.
      - ${ODYSSEUS_DATA_DIR:-./data}/local:/app/.local:z
    extra_hosts:
      # Lets the container reach local services on the Docker host, including
      # Ollama at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      # Pi Coding execution plane (see docs/pi-execution-runtime.md). Odysseus
      # remains the control plane: `native` (the built-in agent loop) stays the
      # default runtime, and flipping this to `pi` delegates the inner coding
      # loop to Pi. The agent dir lives under the data volume so Pi's config
      # (local execution provider only — no premium credentials) survives a
      # container recreate instead of landing in the operator's ~/.pi.
      - ODYSSEUS_EXECUTION_RUNTIME=${ODYSSEUS_EXECUTION_RUNTIME:-native}
      - ODYSSEUS_PI_AGENT_DIR=${ODYSSEUS_PI_AGENT_DIR:-/app/data/pi/agent}
      # Ollama on the Docker host (extra_hosts maps host.docker.internal).
      - ODYSSEUS_PI_LOCAL_BASE_URL=${ODYSSEUS_PI_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=${ODYSSEUS_CHAT_UPLOAD_MAX_BYTES:-10485760}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      # Dev Preview masked env editor: refuse plaintext non-loopback secret writes
      # unless this is set true. Generic default = false (fail-closed). This box is
      # a trusted LAN/Tailscale dev host served over HTTP, so .env sets it true.
      - DEV_PREVIEW_ALLOW_INSECURE_ENV_WRITE=${DEV_PREVIEW_ALLOW_INSECURE_ENV_WRITE:-false}
      # PUID / PGID — the user/group the container drops to before
      # running uvicorn (entrypoint also chowns /app/data + /app/logs
      # to match, so bind-mounted files stay editable from the host).
      # 1000 is the default first user on most Linux installs. If your
      # host user has a different id, override here or via .env, e.g.:
      #   PUID=1001
      #   PGID=1001
      # Find yours with:  id -u  /  id -g
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/app/data/ms-playwright}
      - npm_config_cache=${npm_config_cache:-/app/data/.npm}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"

  chromadb:
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    # PINNED tag + digest (avoid :latest drift; review 2026-06-05). Docker pulls
    # by the digest; the version tag documents which release it is and keeps the
    # upstream pin regression guard (#1414 / tests/test_searxng_image_pinned.py).
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed@sha256:c6dde203961b0b138d17ecbcef31026852a4210926564af48acf58352da38b42
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        tmpl=/tmp/searxng-settings.yml.template
        live=/etc/searxng/settings.yml
        # Re-render when the template's version marker changes, so edits to
        # config/searxng/settings.yml (e.g. the engine list) reach an existing
        # named volume instead of being ignored after first boot. The existing
        # secret_key is carried over so a re-render does not rotate it.
        marker="$$(grep -m1 '^# odysseus-searxng-settings:' "$$tmpl" || true)"
        if [ ! -s "$$live" ] \
          || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' "$$live" \
          || { [ -n "$$marker" ] && ! grep -qxF "$$marker" "$$live"; }; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ] && [ -s "$$live" ]; then
            secret="$$(sed -n 's/^  secret_key: "\([A-Za-z0-9_-]*\)"$$/\1/p' "$$live" | head -1)"
          fi
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" "$$tmpl" > "$$live"
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    # The official searxng image runs as the non-root `searxng` user, but its
    # entrypoint still needs to chown /etc/searxng on first boot, drop privs via
    # su-exec, and (with our wrapper above) write settings.yml into the named
    # volume. Without these capabilities the wrapper aborts at the redirection
    # with EACCES and the container fails its healthcheck with permission
    # errors during setup. Mirrors the cap set recommended by the upstream
    # searxng-docker compose file. See issue #721.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
